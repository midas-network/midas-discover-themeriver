<!DOCTYPE html>
<html lang="en">
<head>
    <title>Midas River</title>
    <link rel="stylesheet" href="./css/themeriver.css">
    <link rel="stylesheet" type="text/css" href="./css/bootstrap.min.css">
    <script src="./js/d3.min.js"></script>
    <script src="./js/jquery.min.js"></script>
    <script src="./js/riverStats.js"></script>
    <script src="./js/colors.js"></script>

</head>
<body>
<div class="container">
    <div id="header-row" class="row">
        <div id="title">Top 20 Most Frequently Occurring <span id="pubmed-datasource-in-title"></span> <i><span
                id="ngram-size-in-title"></span></i> in Infections Disease Modeling Papers Written by
            MIDAS Members
        </div>
        <div id="subtitle">By Year, 2010-2022</div>
    </div>
    <div id="chart-row" class="row">
        <div id="wrapper" class="col-md-12">
            <svg id="main-svg" class="svgs" style="background-color: #ffffff;" width="100%" height="100%"></svg>
        </div>
    </div>
    <div id="info-row" class="row">
        <div class="col-md-2">
            <div id="options">
                <div class="options-header" id="ngram-line">N-gram Size:</div>
                <div class="control-group-ngram">

                    <label class="control control-radio">
                        1
                        <input type="radio" name="ngram-radio" value="1" checked="checked"/>
                        <div class="control_indicator"></div>
                    </label>
                    <label class="control control-radio">
                        2
                        <input type="radio" name="ngram-radio" value="2"/>
                        <div class="control_indicator"></div>
                    </label>
                    <label class="control control-radio">
                        3
                        <input type="radio" name="ngram-radio" value="3"/>
                        <div class="control_indicator"></div>
                    </label>
                </div>
                <div class="options-header" id="pubmed-rb-line">PubMed Field for Topics:</div>
                <div class="control-group-pubmed-source">
                    <label class="control control-radio">
                        MeSH Terms
                        <input type="radio" name="pubmed-source-radio" value="meshTerms" checked="checked"/>
                        <div class="control_indicator"></div>
                    </label>
                    <label class="control control-radio">
                        Keywords
                        <input type="radio" name="pubmed-source-radio" value="pubmedKeywords"/>
                        <div class="control_indicator"></div>
                    </label>
                    <label class="control control-radio">
                        Abstracts
                        <input type="radio" name="pubmed-source-radio" value="paperAbstract"/>
                        <div class="control_indicator"></div>
                    </label>

                </div>
            </div>
        </div>

        <div class="col-md-10">
            <div id="topic-line"><span id="current-topic-count"></span> papers with topic "<span
                    id="current-topic"></span>" in <span id="current-year"></span>:
            </div>
            <div id="instruction-line">Click the graph to display list of papers for year and topic.</div>
            <div id="paper-list" class="side-panel"></div>
        </div>
    </div>
    <div class="box_with_arrow" id="word-box">
        <div id="word-label"></div>
        <div id="freq-count"></div>
    </div>
</div>
</body>
    <script src="./js/main.js"></script>
</html>
