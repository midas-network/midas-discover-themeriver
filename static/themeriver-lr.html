    <script>

        //const xValue = d => d['count'];

        const province_color = function(idx){
            let randomColor = Math.floor(Math.random(idx)*16777215).toString(16);
            if (randomColor.length < 6){
                randomColor += '0'
            }
            return "#" + randomColor;
        }


        const renderinit = function(data, seq){ 
            // Linear Scale: Data Space -> Screen Space; 
            xScale = d3.scaleLinear()
            .domain([0, dates.length-1])
            .range([0, innerWidth]);

            // Introducing y-Scale; 
            yScale = d3.scaleLinear()
            .domain([up_max, 0, -low_max]) // "extent" is equivalent to [d3.min(data, xValue), d3.max(data, xValue)]; 
            .range([innerHeight, innerHeight / 2, 0])
            .nice();

            nyScale = d3.scaleLinear()
            .domain([-up_max, 0, low_max])
            .range([innerHeight, innerHeight / 2, 0])
            .nice();

            yBandScale = d3.scaleBand()
            .domain(barKeys_reverse)
            .range([innerHeight - innerHeight / 8, innerHeight])
            .padding(0.01);

            nyBandScale = d3.scaleBand()
            .domain(barKeys)
            .range([20, innerHeight / 8 + 20])
            .padding(0.01);

            xBarScale = d3.scaleLinear()
            .domain([0, 60000])
            .range([0, innerWidth / 3]);    

            // generate maxX and maxY; 
            maxX = xScale(d3.max(data, xValue));
            maxY = yScale(d3.max(data, yValue));

            // The reason of using group is that nothing is rendered outside svg, so margin of svg is always blank while margin of group is rendered inside svg; 
            const g = svg.append('g')
            .attr('transform', `translate(${margin.left}, ${margin.top})`)
            .attr('id', 'maingroup');

            svg.append('g')
            .attr('transform', `translate(${margin.left}, ${margin.top})`)
            .attr('id', 'hubeigroup');

            // Adding axes; 
            var formatter = d3.format("0")
            const yAxis = d3.axisLeft(yScale)
            .tickSize(-innerWidth)
            .tickFormat(function (d) { 
                if (d === 0) return 0; // No label for '0'
                else if (d < 0) d = -d; // No nagative labels
                return formatter(d);
            })
            //.tickFormat(d3.format('.2s'))
            .tickPadding(10); // .tickPadding is used to prevend intersection of ticks; 
            const xAxis = d3.axisBottom(xScale)
            //.tickFormat(d3.format('.2s'))
            .tickSize(-innerHeight)
            .tickPadding(10)
            .ticks(13);
            // .ticks(24);

            let yAxisGroup = g.append('g').call(yAxis).attr('id', 'yaxis')
            d3.selectAll('#yaxis .tick text').attr('transform', `translate(${0}, ${-3})`);
            yAxisGroup.append('text')
            .attr('transform', `rotate(-90)`)
            .attr('x', -innerHeight / 2)
            .attr('y', -80)
            .attr('fill', 'red')
            .text(yAxisLabel)
            .attr('text-anchor', 'middle') // Make label at the middle of axis. 
            yAxisGroup.selectAll('.domain').remove(); // we can select multiple tags using comma to seperate them and we can use space to signify nesting; 
            
            let xAxisGroup = g.append('g').call(xAxis).attr('transform', `translate(${0}, ${innerHeight})`).attr('id', 'xaxis');
            d3.selectAll('#xaxis .tick text').attr('transform', `translate(${0}, ${5})`);
            xAxisGroup.append('text')
            .attr('y', 60)
            .attr('x', innerWidth / 2)
            .attr('fill', 'red')
            .text(xAxisLabel);
            xAxisGroup.selectAll('.domain').remove();

            // console.log(document.getElementById('xaxis'));
            myticks = ['2010', '2011', '2012', '2013', '2014', '2015',
                '2016', '2017', '2018', '2019', '2020', '2021', '2022']
            for(let tid = 0; tid < myticks.length; tid++){
                document.getElementById('xaxis').getElementsByClassName('tick')[tid].getElementsByTagName('text')[0].textContent = myticks[tid];
            }
            
            var province_name = topics
        };
        
        const render = function(data, keys, area){
            let g;
            if(keys.includes('covid19')){
                g = d3.select('#maingroup');
            }else{
                g = d3.select('#hubeigroup');
            }

            let layers = d3.stack()
            .keys(keys)
            .offset(d3.stackOffsetNone) 
            //.order(d3.stackOrderDescending)
            .order(d3.stackOrderNone)
            (data);
            
            const clipedrect = g.append("clipPath") // Warning: Never append new rect after groups or it shall conflict with barcharts; 
            .attr("id", "rectClip")
            .append("rect")
            .attr('class', 'rect-clip')
            .attr("width", 0)
            .attr("height", innerHeight);

            g.selectAll("path")
            .data(layers)
            .join("path") // use join to avoid split according to "enter" and "update"; 
            .attr("opacity",0.9)
            //.transition().duration(3000)
            .attr("d", function(d,i) {
                // console.log(d);
                return area(d);
            })
            .attr("clip-path", "url(#rectClip)")
            // fill attrbute requires designers to assign colors for each province; 
            .attr("fill", function (d,i) {
                // console.log(d["key"]);
                return province_color(i); })
            .attr("class", function (d,i) {
                return d["key"]
            });


            // document.querySelectorAll('path').forEach(bar => {
            //     const elem = document.querySelector('#word-box')
            //     bar.addEventListener('mouseenter', event => {
            //         // elem.style.left=innerWidth+140 + 'px';
            //         elem.style.left=(event.x+(elem.clientWidth))+ 'px';
            //         elem.style.top=(event.y-(elem.clientHeight/2)) + 'px';
            //         elem.style.display="block";
            //         elem.style.backgroundColor=bar.getAttribute('fill');
            //         var styleElem = document.head.appendChild(document.createElement("style"));
            //         styleElem.innerHTML = "#word-box:before {border-right-color:" + bar.getAttribute('fill') + ";}";
            //         document.querySelector('#word-label').innerHTML=bar.className.baseVal;
            //         document.querySelector('#freq-count').innerHTML=yScale.invert(event.pageY-margin.top);
            //     })
            //     bar.addEventListener('mouseleave', event => {
            //         // document.querySelector('#word-label').style.display="none";
            //         document.querySelector('#word-label').innerHTML="";
            //     })
            // });

            debugger;
            // const wrapper  = d3.select("#wrapper")
            //     .append("svg")
            //     .attr("width", width)
            //     .attr("height", height)
            // const bounds = wrapper
            //     .append("g")
            //     .style("transform", 'translate(${margin.left}px,${}margin.toppx)');
            const listeningRect = g
                .append("rect")
                .attr("class", "listening-rect")
                .attr("width", width)
                .attr("height", height)
                .on("mousemove", onMouseMove)
                .on("mouseleave", onMouseLeave);

            const elem = document.querySelector('#word-box')
            d3.selectAll('path').on('mouseenter', function(e, d){
                console.log('event:')
                console.log(e)
                console.log('data:')
                console.log(d)
            })

            clipedrect.transition().ease(d3.easeLinear).duration(totalduration).attr("width", innerWidth);

            function onMouseMove() {
                console.log('move')
                const mousePosition = d3.mouse(this)
                const hoverDate = xScale.invert(mousePosition[0])
                console.log(mousePosition)
                console.log(hoverDate)
            }
            
            function onMouseLeave() {
                console.log('leave')
            }
            //const path = g.selectAll("path")
            //.data(layers)
            //.join("path") // use join to avoid split according to "enter" and "update"; 
            //.attr("opacity",0.9)
            //.transition().duration(3000)
            //.attr("d", area)
            // fill attrbute requires designers to assign colors for each province; 
            //.attr("fill", function (d,i) { return province_color[d["key"]]; });
            

        };
        const seqgen = function(data){
            // re-arrange the data sequentially; 
            let prestack = []; 
            dates.forEach(datum => {
                prestack.push({'date': datum});
            });
            data.forEach(datum => {
                //sequential[alldates.indexOf(datum['date'])].push(datum);
                prestack[dates.indexOf(datum['date'])][datum['topic']] = yValue(datum);
            });
            return prestack
        }

        // d3.csv('./data/province.csv').then(function(data){
        var year_range = ['2004/1/1','2005/1/1','2006/1/1','2007/1/1']
        d3.csv('./data/year_counts_trim.csv').then(function(data){
            // data = data.filter(datum => {return year_range.includes(datum['date'])});
            data.forEach(datum => {
                // pre-process the data; 
                datum['count'] = +(datum['count']);
                // datum['deaths'] = +(datum['deaths']);
                // datum['death toll'] = +(datum['death toll']);
                // datum['count'] = +(datum['count']);
                // datum['existing diagnosis'] = +(datum['existing diagnosis']);
            });
            
            // remove duplicated items; 
            alldates = Array.from(new Set(data.map( datum => datum['date'])));

            // make sure dates are listed according to real time order; 
            alldates = alldates.sort(function(a,b){
                // turn your strings into dates, and then subtract them
                // to get a value that is either negative, positive, or zero.
                return new Date(b.date) - new Date(a.date);
            });
            dates = alldates;

            // setting up barchart; 
            setting_up_barchart(data);

            // delete 'gorilla';
            data = data.filter(datum => {return datum['topic'] !== 'gorilla'});

            // generate sequential data; 
            let sequential = []; 
            alldates.forEach(datum => {
                sequential.push([]);
            });
            data.forEach(datum => {
                sequential[alldates.indexOf(datum['date'])].push(datum);
            });
            // smooth new infec; 
            let t = 0;
            const originyValue = datum => datum['count'];
            for(; t < sequential.length; t++){
                sequential[t].forEach(datum => {
                    if(t == 0){
                        datum.newinfec_s = originyValue(datum);
                    }else if(t == 1){
                        datum.newinfec_s = (
                            originyValue(datum) + 
                            originyValue(sequential[t-1].find(x => x['topic'] === datum['topic']))
                        ) / 2.0;
                    }else{
                        datum.newinfec_s = (
                            originyValue(datum) + 
                            originyValue(sequential[t-1].find(x => x['topic'] === datum['topic'])) +
                            originyValue(sequential[t-2].find(x => x['topic'] === datum['topic']))
                        ) / 3.0;
                    }
                })
            }

            // split data from Hu-Bei and not from Hu-Bei; 
            data_hubei = data.filter(datum => {return datum['topic'] === 'covid19'});
            data = data.filter(datum => {return datum['topic'] !== 'covid19'});

            // stack data; 
            let prestack = seqgen(data);
            let prestack_hubei = seqgen(data_hubei);
            // let keys = Array.from(new Set(data.map( datum => datum['topic'])));
            // sort according to '累计确诊' and prepare keys; 
            const sortedforkey = sequential[sequential.length-1].sort( (a,b) => b['count'] - a['count'] );
            let keys = sortedforkey.map(d => d['topic']);
            keys = keys.filter(d => {return d !== 'covid19'});
            let keys_hubei = Array.from(new Set(data_hubei.map( datum => datum['topic'])));

            // generate low_max and up_max for Y-scale; 
            up_max = d3.max(sequential, seq => {
                // console.log(seq);
                result = 0;
                seq.forEach(s => {
                    if(s['topic'] !== 'covid19'){
                        result += yValue(s);
                    }
                })
                return result;
            })
            low_max = d3.max(sequential, seq => {
                if(limit_up_max !== -1){
                    return limit_up_max;
                }
                result = 0;
                seq.forEach(s => {
                    if(s['topic'] === 'covid19'){
                        result += yValue(s);
                    }
                })
                return result;
            })

            // initialize the chart; 
            renderinit(data);

            const area = d3.area()
            .curve(d3.curveCardinal.tension(1)) // default is d3.curveLinear, d3.curveBundle.beta(1.0)
            .x(d => xScale(xValue(d.data)))
            .y0(d => yScale(d[0]))
            .y1(d => yScale(d[1]));

            const area_hubei = d3.area()
            .curve(d3.curveCardinal.tension(1))
            .x((d) => xScale(xValue(d.data)))
            .y0(d => nyScale(d[0]))
            .y1(d => nyScale(d[1]));
            
            // set the animation interval; 
            render(prestack, keys, area);
            render(prestack_hubei, keys_hubei, area_hubei); 
        });
    </script>
